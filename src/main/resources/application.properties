spring.application.name=schoolManagement
# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL ───────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.default-property-inclusion=non_null
# ── JWT ──────────────────────────────────────────────────────
jwt.secret=SchoolMgmtSecretKey2024ForJWTSigningMustBe256BitsLong!
jwt.expiration=86400000

# ── Email Notifications (AWS SES) ────────────────────────────
# Master switch. When false, the app never contacts SES (emails are logged & skipped).
app.mail.enabled=false
# The verified SES sender identity (must be verified in your AWS SES account).
app.mail.from=no-reply@example.com
# Friendly display name shown to recipients.
app.mail.from-name=School Management
# Portal URL included in notification emails (login button). Leave blank to omit.
app.mail.login-url=
# AWS region where your SES identity is set up, e.g. us-east-1, ap-south-1, eu-west-1.
app.mail.aws.region=us-east-1
# AWS IAM credentials with the ses:SendEmail permission. FILL THESE IN.
app.mail.aws.access-key-id=YOUR_AWS_ACCESS_KEY_ID
app.mail.aws.secret-access-key=YOUR_AWS_SECRET_ACCESS_KEY
